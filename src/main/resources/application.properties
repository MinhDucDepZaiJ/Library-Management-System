# =========================================
# Cấu hình ứng dụng - Library Management System
# =========================================

spring.application.name=library-management-system
server.port=8080

# ---- MySQL DataSource ----
spring.datasource.url=jdbc:mysql://localhost:3306/library_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=your_mysql_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---- JWT ----
# secret nen it nhat 32 ky tu (HS256) - doi trong moi truong production
jwt.secret=ThisIsASecretKeyForLibraryManagementSystemJWT2026ChangeMeInProd
jwt.expiration-ms=86400000

# ---- Jackson ----
spring.jackson.default-property-inclusion=non_null

# ---- Logging ----
logging.level.org.springframework.security=INFO
logging.level.com.library.lms=DEBUG
